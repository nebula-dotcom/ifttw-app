const actTxt=a=>`<div>${a.on?'Connected '+fd(a.since):'Not connected'}</div><div>Last activity ${fd(a.last,1)}</div><div>Run ${a.run||0} time${a.run==1?'':'s'}</div>`;
function refreshAct(){api('/api/state').then(s=>{A.forEach(a=>{const x=s[a.id];if(x){a.since=x.since;a.last=x.last;a.run=x.run}});const e=$('#ai');if(e&&st[st.length-1]=='det')e.innerHTML=actTxt(A[ix])}).catch(()=>{})}
var actT=0;   // refreshes the Activity text; runs only while the detail page is visible (not a permanent setInterval)
function actLoop(){clearTimeout(actT);actT=0;if(!document.hidden&&st[st.length-1]=='det')actT=setTimeout(()=>{refreshAct();actLoop()},10000)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&st[st.length-1]=='det')refreshAct();actLoop()});
function rDet(){const a=A[ix],s=SV[a.sv],g=s.g,ch=x=>`<span class="ch">${x}</span>`;
$('#det').innerHTML=`<div class="sb" style="${col(a)}"><div class="bar"><button data-a="back">${I('bk')}</button><button data-a="edit">${I('cg')}</button></div></div>
<div class="hd" style="${col(a)}"><div class="hc">
<div class="ics">${I(s.i)}${I('wh')}</div><h1>${esc(T(a))}</h1>
<div class="row a"><button data-a="ren"><u>Edit title</u></button></div>
<div class="row"><span>by pearanoids</span>${a.sv=='bat'?modeBtn(a,ix):'<span class="pro l">Pro</span>'}</div></div></div>
<div class="w">${tgl(a,ix,'big')}<h3>About this Applet</h3><div class="ab">
<div class="st i" style="${col(a)}"><b>If</b><div class="sq">${I(s.i)}</div><div><h4>${esc(a.t)}</h4>
<span class="ch">${I(a.k=='Polling'?'pg':'rl')} ${a.k} trigger</span><p>${esc(a.d)}</p>
<small>Trigger ingredients</small>${g.slice(0,4).map(ch).join('')}${g.length>4?ch(`+ ${g.length-4} more ingredients`):''}</div></div>
<div class="st" style="--c:#09f"><b>Then</b><div class="sq">${I('wh')}</div><div><h4>Make a web request <span class="pro">Pro</span></h4>
<span class="ch">${I('ac')} Action</span><p>This action will make a web request to a publicly accessible URL. NOTE: Requests may be rate limited.</p>
<small>Action fields</small>${['url','method','content_type','additional_headers','body'].map(ch).join('')}</div></div></div>
<div class="id mu">ID ${a.id}</div>
<div class="act"><h3>Activity</h3><div id="ai" style="display:contents">${actTxt(a)}</div>
<div class="log"><span>Check the log of your Applet runs</span><button class="ob" data-a="log">View activity</button></div></div></div>`;refreshAct()}

function rEdt(){const a=A[ix],s=SV[a.sv];
$('#edt').innerHTML=`<div class="w"><div class="bar eb"><button data-a="back">${I('bk')}</button><b class="tt">Edit Applet</b><svg class="hq"><use href="#hp"/></svg></div>
<p class="ed">Created by <b>pearanoids</b></p><p class="ed">You're using ${A.filter(a=>a.on).length} of ${A.length} Applets.</p>
<div class="lb" style="${col(a)}"><b>If</b>${I(s.i)}<span>${esc(a.t)}</span></div>
<div class="cn"><span class="pb">${I('pl')}</span></div>
<button class="lb" style="--c:#09f" data-a="act"><b>Then</b>${I('wh')}<span>Make a web request</span>${P[a.id]?'<em class="eg">Edited</em>':''}</button>
<div class="upw"><button class="up${P[a.id]?' rdy':''}" data-a="upd"><span class="ul">Update</span><svg class="us" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9"/></svg><svg class="uc" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button></div></div>`}

const toH=v=>esc(v).replace(/\{\{(\w+)\}\}/g,'<span class="ing" contenteditable="false" data-k="$1">$1</span>');
const ser=e=>[...e.childNodes].map(n=>n.nodeType==3?n.textContent:(n.dataset&&n.dataset.k?`{{${n.dataset.k}}}`:(n.innerText||''))).join('');
function rCnf(){const a=Object.assign({},A[ix],P[A[ix].id]);$('#fu').innerHTML=toH(a.u);$('#fh').innerHTML=toH(a.h);$('#fb').innerHTML=toH(a.b);$('#fm').value=a.m;$('#fc').value=a.ct}
function stage(){const a=A[ix],d={u:ser($('#fu')).trim(),h:ser($('#fh')),b:ser($('#fb')),m:$('#fm').value,ct:$('#fc').value};
if(['u','h','b','m','ct'].every(k=>d[k]==a[k]))delete P[a.id];else P[a.id]=d}   // not sent to the server yet: waits for the Update button

const sh=id=>{$('#bd').hidden=false;$('#'+id).hidden=false},cl=()=>{$('#bd').hidden=true;$$('.sh').forEach(e=>e.hidden=true)};
function toast(m,ms){const t=$('#ts');t.textContent=m;t.hidden=false;t.onclick=()=>{t.hidden=true};clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,ms||1800)}
function openIng(){const s=SV[A[ix].sv];$('#s2').innerHTML=`<h4 style="justify-content:flex-start;gap:16px"><span style="font-size:44px;display:flex">${I(s.i)}</span>${s.n}</h4>`+s.g.map(k=>`<button class="ig" data-a="ing" data-k="${k}">${k}</button>`).join('');sh('s2')}
function addIng(k){const e=tg||$('#fb'),s=getSelection();let r=s.rangeCount&&e.contains(s.anchorNode)?s.getRangeAt(0):null;
if(!r){r=document.createRange();r.selectNodeContents(e);r.collapse(false)}
const c=document.createElement('span');c.className='ing';c.contentEditable='false';c.dataset.k=k;c.textContent=k;
r.deleteContents();r.insertNode(c);r.setStartAfter(c);r.collapse(true);s.removeAllRanges();s.addRange(r)}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=+b.dataset.i;
if(a=='open'){ix=i;nav('det')}
else if(a=='tog'){A[i].on=A[i].on?0:1;if(A[i].on)A[i].since=Date.now()/1e3;sync(A[i]);if(i==ix&&$('#ai'))$('#ai').innerHTML=actTxt(A[i]);$$(`.tg[data-i="${i}"]`).forEach(t=>t.classList.toggle('off',!A[i].on))}
else if(a=='back'){if(st[st.length-1]=='edt'&&P[A[ix].id])sh('s4');else back()}
else if(a=='dis'){delete P[A[ix].id];cl();back();toast('Changes discarded')}
else if(a=='mode'){const x=A[i];x.auto=x.auto?0:1;sync(x);b.classList.toggle('m',!x.auto);toast(x.auto?'Automation: webhook is sent automatically':'Manual: post from View activity',2600)}
else if(a=='edit')nav('edt');
else if(a=='ren'){$('#ti').value=T(A[ix]);sh('s3');$('#ti').focus();$('#ti').select()}
else if(a=='svt'){const v=$('#ti').value.trim();if(v)A[ix].title=v;else delete A[ix].title;sync(A[ix]);cl();draw();toast('Title updated')}
else if(a=='act')sh('s1');
else if(a=='cfg'){cl();nav('cnf')}
else if(a=='soon'){cl();toast('Not available in IFTTW')}
else if(a=='close')cl();
else if(a=='add'){tg=$('#'+b.dataset.f);openIng()}
else if(a=='ing'){cl();addIng(b.dataset.k)}
else if(a=='upd')doUpdate(b);
else if(a=='save'){stage();back();toast(P[A[ix].id]?'Action saved.\nTap Update to apply':'No changes')}
else if(a=='log')nav('alog');else if(a=='post')doPost(+b.dataset.id,b);else if(a=='chk')doCheck(b)});
$$('.fd').forEach(e=>{e.onpaste=v=>{v.preventDefault();document.execCommand('insertText',false,v.clipboardData.getData('text'))};e.onfocus=()=>tg=e});
$('#fu').onkeydown=e=>{if(e.key=='Enter')e.preventDefault()};
$('#ti').onkeydown=e=>{if(e.key=='Enter')$('[data-a=svt]').click()};
const api=(u,o)=>fetch(u,o).then(r=>r.json().then(j=>{if(!r.ok)throw Error(j.error||r.status);return j}));
const push=a=>api('/api/applet/'+a.id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({on:a.on?1:0,auto:a.auto?1:0,u:a.u,h:a.h,b:a.b,m:a.m,ct:a.ct,title:a.title||''})}),
sync=a=>push(a).then(j=>{if(j&&j.closing)toast('All Applets disconnected.\nClosing IFTTW',3000)}).catch(()=>{});
function rLog(){const a=A[ix];
$('#alog').innerHTML=`<div class="sb"><div class="bar"><button data-a="back">${I('bk')}</button><b class="tt">Activity</b></div></div><div class="w"><p class="ed">${esc(T(a))}</p>${a.sv=='bat'?`<p class="ed">Mode: <b>${a.auto?'Automation':'Manual'}</b></p>`:''}<button class="ob ck" data-a="chk">Check now</button><p class="cs" id="cs" hidden></p><div id="ll"><p class="em">Loading</p></div></div>`;loadLog()}
function loadLog(f){const a=A[ix];api('/api/activity/'+a.id).then(r=>{const l=$('#ll');if(!l)return;
const sg=JSON.stringify(r);if(!f&&l.dataset.sg==sg&&l.querySelector('.en'))return;l.dataset.sg=sg;   // same data: keep the list, so photos that are still loading are not cancelled
l.innerHTML=r.length?r.map(x=>`<div class="en"><h4>${esc(x.title)}</h4><small>${esc(x.sub)}</small>${x.img?`<img class="wt" data-s="${esc(x.img)}" referrerpolicy="no-referrer" alt="">`:''}${x.err?`<small class="fe">Auto-send failed: ${esc(x.err)}</small>`:''}<button class="ob${x.posted?' dn':''}" data-a="post" data-id="${x.id}">${x.posted?(x.by=='auto'?'Sent automatically · Post again':'Posted · Post again'):'Post to Discord'}</button></div>`).join(''):'<p class="em">No activity yet</p>';loadImgs(l)}).catch(()=>{const l=$('#ll');if(l)l.innerHTML='<p class="em">Server not reachable</p>'})}
// Photos load strictly one at a time, top to bottom, so NASA's host never gets parallel downloads. A photo that fails or stalls (45 s)
// goes to the back of the queue and is retried (2 more tries), so one bad photo never blocks the others.
let imgGen=0;
function loadImgs(box){const g=++imgGen,q=[...box.querySelectorAll('img[data-s]')],tr=new Map();
const live=im=>g==imgGen&&im.isConnected&&st[st.length-1]=='alog',
next=()=>{while(q.length&&!live(q[0]))q.shift();if(q.length)run(q.shift())},
run=im=>{let t;
const fin=ok=>{clearTimeout(t);im.onload=im.onerror=null;
if(ok){im.classList.remove('wt');im.classList.add('ok')}
else{const k=(tr.get(im)||0)+1;tr.set(im,k);im.removeAttribute('src');if(k<3)q.push(im);else im.hidden=true}
setTimeout(next,ok||q.length>1?0:1500)};
im.onload=()=>fin(1);im.onerror=()=>fin(0);t=setTimeout(()=>fin(0),45000);im.src=im.dataset.s};
next()}
function doPost(id,b){b.disabled=true;b.textContent='Posting…';api('/api/post/'+id,{method:'POST'}).then(j=>{A[ix].run=j.run;toast('Posted to Discord')}).catch(e=>toast(e.message,8000)).finally(()=>loadLog(1))}
function doCheck(b){const a=A[ix],cs=$('#cs'),say=(t,c)=>{if(cs){cs.hidden=!t;cs.className='cs '+(c||'');cs.textContent=t}};
b.disabled=true;b.textContent='Checking…';say(a.sv=='bat'?'Reading the current charger state.':'Fetching the latest photos from NASA.');
api('/api/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({aid:a.id})}).then(j=>{const r=(j.results||{})[a.id];
if(!r)say('No result from the app','er');
else if(r.ok){say('Checked '+fd(r.at,1)+' · '+(a.sv=='bat'?r.new+' new event(s)':r.found+' found · '+r.new+' new'),'ok');toast(a.sv=='bat'?r.new+' new item(s)':r.found+' photos found, '+r.new+' new')}
else{say('Failed: '+r.err,'er');toast(r.err,8000)}
}).catch(e=>{say('Failed: '+e.message,'er');toast(e.message,8000)}).finally(()=>{b.disabled=false;b.textContent='Check now';loadLog()})}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function burst(b){const c=['#2cb85c','#fff','#ffd54f','#09f'];for(let k=0;k<12;k++){const i=document.createElement('i');i.className='pt';i.style.cssText=`--a:${k*30}deg;--pc:${c[k%4]}`;b.appendChild(i)}}
function doUpdate(b){const x=A[ix],d=P[x.id];
if(!d){toast('No changes to update');return}
b.classList.remove('rdy');b.classList.add('ld');const t0=Date.now();
push(Object.assign({},x,d)).then(()=>wait(Math.max(0,800-(Date.now()-t0)))).then(()=>{
Object.assign(x,d);delete P[x.id];b.classList.remove('ld');b.classList.add('ok');burst(b);
setTimeout(()=>{if(st[st.length-1]=='edt'){back();toast('Applet updated')}},1300)
}).catch(e=>{b.classList.remove('ld');b.classList.add('rdy','bad');toast('Update failed: '+e.message,6000);setTimeout(()=>b.classList.remove('bad'),450)})}
const c01=v=>Math.max(0,Math.min(1,v)),sm=t=>t*t*(3-2*t);
function sbDet(){const sb=$('#det .sb'),hd=$('#det .hd'),hc=$('#det .hc');if(!sb||!hd||!hc||st[st.length-1]!='det')return;
const B=sb.getBoundingClientRect().bottom,d=hd.getBoundingClientRect().bottom-B,
tb=c01(1-d/16),                                 // top bar color: fully opaque exactly when the container's edge reaches the bottom of the top bar
ts=c01(-d/20);                                  // white shadow: appears once the container's edge has passed, above the Connect button
sb.style.setProperty('--o',sm(tb));sb.style.setProperty('--sh',sm(ts));
hd.style.setProperty('--r',34*(1-sm(c01(1-d/64)))+'px');   // the rounded corner flattens before the container's edge arrives
const t=hc.getBoundingClientRect().top;hc.style.setProperty('--m0',B-20-t+'px');hc.style.setProperty('--m1',B-t+'px')}
function sbCnf(){const sb=$('#cnf .sb'),lg=$('#cnf .hero .lg');if(!sb||!lg||st[st.length-1]!='cnf')return;
const B=sb.getBoundingClientRect().bottom,r=lg.getBoundingClientRect(),d=r.top+r.height*.14-B;   // distance from the top of the webhook logo to the bottom of the top bar
sb.style.setProperty('--o',sm(c01(1-d/28)));sb.style.setProperty('--sh',sm(c01(1-d/20)))}
function sbLog(){const sb=$('#alog .sb');if(!sb||st[st.length-1]!='alog')return;
sb.style.setProperty('--sh',sm(c01(scrollY/24)))}   // Activity: white shadow fades in as the list scrolls under the top bar
function sbUpdate(){sbDet();sbCnf();sbLog()}
let rq=0;const onS=()=>{rq||(rq=requestAnimationFrame(()=>{rq=0;sbUpdate()}))};
addEventListener('scroll',onS,{passive:true});addEventListener('resize',onS);
draw();
api('/api/state').then(s=>{A.forEach(a=>{if(s[a.id])Object.assign(a,s[a.id]);else{a.run=0;sync(a)}});draw()}).catch(()=>{});
</script></body></html>
